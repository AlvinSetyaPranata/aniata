name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: SSH deploy (full)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Abort the remote script on first error so a failed deploy fails CI.
          script_stop: true
          script: |
            bash /home/ubuntu/aniata/scripts/deployment.sh full

      - name: Verify deployment
        run: |
          sleep 3
          curl -fsS -o /dev/null "http://${{ secrets.VPS_HOST }}:83/api/products"
          curl -fsS -o /dev/null "http://${{ secrets.VPS_HOST }}:83/"
          echo "Deployment OK: API and SPA both responding on :83"

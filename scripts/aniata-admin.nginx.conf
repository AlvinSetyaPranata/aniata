# Aniata — admin panel nginx site config.
#
# Served on its own port (:84) so it does not clash with the store SPA on :83
# (nor the existing app on :80/:443). Install via scripts/_common.sh ->
# install_nginx_config. __APP_DOMAIN__ / __PHP_FPM_SOCK__ are replaced at
# install time.
#
# Topology:
#   /      -> admin SPA (pm2 on 127.0.0.1:3002)
#   /api   -> Laravel via php-fpm (unix socket, same-origin as the SPA)

server {
    listen 84;
    listen [::]:84;
    server_name __APP_DOMAIN__;

    # --- Admin SPA (pm2 on :3002) ---
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # --- Laravel API (php-fpm) — same-origin to the admin SPA ---
    location /api {
        root /home/ubuntu/aniata/backend/public;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        root /home/ubuntu/aniata/backend/public;
        include snippets/fastcgi-php.conf;
        # Forward the Authorization header (Sanctum bearer tokens) — php-fpm
        # strips it by default, which would 401 every admin API call.
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass unix:__PHP_FPM_SOCK__;
    }
}

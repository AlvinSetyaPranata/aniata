# Aniata — nginx site config (served alongside your existing app on :80/:443).
#
# Install on the VPS via the deploy scripts (scripts/_common.sh ->
# install_nginx_config). __APP_DOMAIN__ is replaced with $APP_DOMAIN
# (default: the box's hostname) at install time.
#
# Topology:
#   /      -> pm2 SPA on 127.0.0.1:3001
#   /api   -> Laravel via php-fpm (unix socket)

server {
    listen 80;
    listen [::]:80;
    server_name __APP_DOMAIN__;

    # --- Frontend SPA (pm2 on :3001) ---
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # --- Laravel API (php-fpm) ---
    location /api {
        root /home/ubuntu/aniata/backend/public;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        root /home/ubuntu/aniata/backend/public;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }
}

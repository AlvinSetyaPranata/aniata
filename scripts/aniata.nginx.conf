# Aniata — nginx site config, served on its own port (:83) so it does not
# clash with the existing app already bound to :80/:443.
#
# Install on the VPS via the deploy scripts (scripts/_common.sh ->
# install_nginx_config). __APP_DOMAIN__ is replaced with $APP_DOMAIN
# (default: the box's hostname) at install time.
#
# Topology:
#   /      -> pm2 SPA on 127.0.0.1:3001
#   /api   -> Laravel via php-fpm (unix socket)

server {
    listen 83;
    listen [::]:83;
    server_name __APP_DOMAIN__;

    # Allow product image uploads (single image + gallery). Default 1M triggers
    # 413 Request Entity Too Large. Set at server level so every location is
    # covered (the /api upload also internally rewrites to index.php).
    client_max_body_size 64M;

    # --- Uploaded product images (public/storage symlink -> storage/app/public) ---
    location /storage/ {
        root /home/ubuntu/aniata/backend/public;
        try_files $uri =404;
    }

    # --- Frontend SPA (pm2 on :3001) ---
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # --- Laravel API (php-fpm) ---
    location /api {
        root /home/ubuntu/aniata/backend/public;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        root /home/ubuntu/aniata/backend/public;
        include snippets/fastcgi-php.conf;
        # Forward the Authorization header (Sanctum bearer tokens) — php-fpm
        # strips it by default, which would 401 every admin API call.
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass unix:__PHP_FPM_SOCK__;
    }
}
